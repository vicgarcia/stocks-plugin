name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from date
        id: version
        run: echo "version=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Create release zip
        run: |
          zip -r stocks-plugin-v${{ steps.version.outputs.version }}.zip .claude-plugin/plugin.json skills/stocks/SKILL.md skills/stocks/scripts/stocks.py
          cd skills && zip -r ../stocks-skill-v${{ steps.version.outputs.version }}.zip stocks/SKILL.md stocks/scripts/stocks.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: |
            stocks-plugin-v${{ steps.version.outputs.version }}.zip
            stocks-skill-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
